<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-tile">
  <title id="title-tile">DocuMorph Application Icon Tile</title>
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242427"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3823"/>
      <stop offset="50%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <linearGradient id="top-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D3D"/>
      <stop offset="100%" stop-color="#C42B1C"/>
    </linearGradient>
    <linearGradient id="bot-facet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A80000"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
  </defs>

  <!-- Fluent App Squircle Tile -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#tile-bg)" stroke="#38383D" stroke-width="2"/>

  <!-- Left Foundation Spine (Original Document Structure) -->
  <rect x="46" y="44" width="48" height="168" rx="14" fill="url(#spine-grad)"/>

  <!-- Upper Morphing Wing (Flowing Transformation Facet) -->
  <path d="M 106 44 L 148 44 C 187.76 44 220 76.24 220 116 C 220 126.8 217.6 137.0 213.2 146.2 L 152 108 L 106 108 Z" fill="url(#top-facet)"/>

  <!-- Lower Fixed Vector Facet (The Immutable Archival Target) -->
  <path d="M 106 148 L 152 148 L 213.2 110.8 C 217.6 120.0 220 130.2 220 140 C 220 179.76 187.76 212 148 212 L 106 212 Z" fill="url(#bot-facet)"/>

  <!-- Central Dynamic Vector Beam / Diamond Aperture -->
  <polygon points="174,116 194,128 174,140 154,128" fill="#FFFFFF"/>
</svg>