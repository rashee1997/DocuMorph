[package]
name = "documorph"
version = "1.0.0"
edition = "2021"
authors = ["Rasheed Hameed <rasheedhmech03@gmail.com>"]
description = "High-fidelity Windows context-menu document-to-PDF engine with TrueType font embedding"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rashee1997/DocuMorph"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Console",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
